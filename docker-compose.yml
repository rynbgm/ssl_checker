# docker-compose.yml
version: '3.8'

services:
  # --- CONTENEUR 1
  flask_app:
    container_name: mon_backend_python
    build: ./app          
    expose:
      - "8000"         

  # --- CONTENEUR 2 : LE SERVEUR WEB ---
  nginx:
    image: nginx:alpine 
    container_name: mon_serveur_web
    ports:
      - "80:80"
      - "443:443"          
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./images:/var/www/sslchecker/images
      - ./static:/var/www/sslchecker/static
      - ./nginx/certificat.pem:/etc/nginx/ssl/certificat.pem
    depends_on:
      - flask_app        
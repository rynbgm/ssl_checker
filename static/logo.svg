<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="100%">
  <defs>
    <style>
      /* Main color palette */
      .bg-box { fill: #1c1c1c; }
      .node { fill: #ffffff; }
      .link { 
        stroke: #ffffff; 
        stroke-width: 6; 
        fill: none; 
        stroke-linecap: round; 
        stroke-linejoin: round; 
      }
      
      /* Typography styling */
      .ssl-text {
        font-family: 'Arial Black', Impact, system-ui, sans-serif;
        font-size: 100px;
        font-weight: 900;
        fill: #1c1c1c;
        font-style: italic;
        letter-spacing: -6px;
      }
      .checker-text {
        font-family: 'Arial Black', Impact, system-ui, sans-serif;
        font-size: 36px;
        font-weight: 900;
        fill: #1c1c1c;
        letter-spacing: 2.5px;
      }
    </style>
  </defs>

  <rect class="bg-box" x="15" y="15" width="85" height="130" rx="16" />

  <polyline class="link" points="38,38 77,59 38,80 77,101 38,122" />

  <circle class="node" cx="38" cy="38" r="11" />
  <circle class="node" cx="77" cy="59" r="11" />
  <circle class="node" cx="38" cy="80" r="11" />
  <circle class="node" cx="77" cy="101" r="11" />
  <circle class="node" cx="38" cy="122" r="11" />

  <text class="ssl-text" x="120" y="98">SSL</text>

  <text class="checker-text" x="126" y="138">CHECKER</text>
</svg>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page introuvable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --color-bg: #faf9f7;
            --color-surface: #ffffff;
            --color-border: #e8e5e0;
            --color-text: #2d2a26;
            --color-text-muted: #78736d;
            --color-primary: #6b7fd7;
            --color-primary-light: #eef1fc;
            --color-danger: #b91c1c;
            --color-danger-bg: #fef2f2;
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #fdfcfb 0%, #f7f5f2 100%);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: var(--color-danger-bg);
            border: 2px solid #fca5a5;
            border-radius: var(--radius-lg);
            margin-bottom: 1.75rem;
        }

        .icon-wrap i {
            font-size: 2rem;
            color: var(--color-danger);
        }

        .error-code {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--color-primary) 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .error-message {
            font-size: 0.9375rem;
            color: var(--color-text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-path {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 0.3rem 0.75rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            color: var(--color-text-muted);
            margin-bottom: 2rem;
            word-break: break-all;
        }

        .divider {
            height: 1px;
            background: var(--color-border);
            margin: 0 0 2rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            background: var(--color-primary);
            color: #fff;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 4px rgba(107,127,215,0.3);
        }

        .btn-home:hover {
            background: #5a6ec5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107,127,215,0.35);
        }

        .btn-home:active { transform: translateY(0); }

        .footer {
            font-size: 0.8125rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .footer i {
            color: var(--color-primary);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrap">
                <i class="fa-solid fa-file-circle-xmark"></i>
            </div>

            <div class="error-code">404</div>
            <div class="error-title">Page introuvable</div>
            <div class="error-message">
                La ressource que vous recherchez n'existe pas ou a été déplacée.
            </div>

            <div class="error-path" id="current-path">/page-inconnue</div>
            <div class="divider"></div>

            <a href="/" class="btn-home">
                <i class="fa-solid fa-arrow-left"></i>
                Retour à l'accueil
            </a>
        </div>

        <div class="footer">
            <i class="fa-solid fa-shield-halved"></i>
            SSL Checker — Analyse de sécurité
        </div>
    </div>
</body>
</html>
